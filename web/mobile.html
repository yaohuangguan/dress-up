<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191919"><title>衣见 · 上传人物</title><link rel="stylesheet" href="/mobile.css"><script src="/mobile.js" defer></script></head><body><main><div class="mark">衣</div><div class="eyebrow">LOCAL LOOK STUDIO</div><h1>把自己，带进灵感里。</h1><p>拍一张清晰正面照，或从相册选择照片。<br>图片直接传到你的电脑。</p><div class="preview" id="preview"><span>＋</span><img id="image" alt="待上传人物照片" hidden></div><div class="actions"><button id="camera">拍一张照片</button><button id="album" class="secondary">从相册选择</button></div><input id="cameraInput" type="file" accept="image/*" capture="user" hidden><input id="albumInput" type="file" accept="image/png,image/jpeg,image/webp" hidden><button id="send" hidden>上传到电脑 →</button><p id="status" role="status">电脑与手机需连接同一 Wi-Fi<br>二维码有效期 10 分钟，仅可上传一次</p><footer>衣见 · 照片留在你的本地设备</footer></main></body></html>
